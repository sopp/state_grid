services:
  sgcc-sidecar:
    build:
      # 仓库里这份按"整仓为上下文"写（context: ..）。NAS 上不放 git 仓库，实际用的是
      # /mnt/scsi0.1-1/Configs/sgcc-sidecar/docker-compose.yml，那份把 context 换成 ./src，
      # 目录布局一致：src/sidecar/Dockerfile + src/custom_components/state_grid/click_captcha_solver.py
      context: ..
      dockerfile: sidecar/Dockerfile
    image: sgcc-sidecar:local
    container_name: sgcc-sidecar
    # profile 就是这个浏览器实例的身份（瑞数/TDID/TDC_itoken 都在里面），重建容器不能重建它
    volumes:
      - ./data:/data
      # 想让"在 HA 界面里改一次就生效"，去掉下面这行注释挂载，并在 .env 里设
      # SGCC_HA_STORE=/ha-config/.storage/state_grid.config：sidecar 每轮开工前只读那几个键
      # （llm_api_key/llm_base_url/llm_model + account/email_account），读到就以它为准并打一行日志；
      # 只打长度不打值。必须挂**目录**而不是那个文件——HA 写 .storage 是新建再改名，绑文件会把
      # 容器钉在旧 inode 上，之后 HA 改多少遍容器里读到的都是老的。
      # 密码不在其中：实测 store 里的 password 是 32 位大写 md5 摘要，而登录框要明文（pwLen=10），
      # 填摘要等于密码错误，所以 SGCC_PASSWORD 继续只从 .env 来。
      # - /mnt/scsi0.1-1/Configs/HomeAssistant:/ha-config:ro
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    # headless=new 不需要 X；/dev/shm 太小会让 Chrome 渲染进程直接退出
    shm_size: 1g
