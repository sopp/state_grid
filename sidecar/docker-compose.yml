services:
  sgcc-sidecar:
    build:
      # 仓库里这份按"整仓为上下文"写（context: ..）。NAS 上不放 git 仓库，实际用的是
      # /mnt/scsi0.1-1/Configs/sgcc-sidecar/docker-compose.yml，那份把 context 换成 ./src，
      # 目录布局一致：src/sidecar/Dockerfile + src/custom_components/state_grid/click_captcha_solver.py
      context: ..
      dockerfile: sidecar/Dockerfile
    image: sgcc-sidecar:local
    container_name: sgcc-sidecar
    # profile 就是这个浏览器实例的身份（瑞数/TDID/TDC_itoken 都在里面），重建容器不能重建它
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    # headless=new，不需要 X；给点共享内存，否则 Chrome 在容器里会崩
    shm_size: 1g
